spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=com.talkcs.backend.testsupport.TestH2Dialect
spring.jpa.properties.hibernate.dialect=com.talkcs.backend.testsupport.TestH2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT (matches main app's property keys: app.jwt.secret, app.jwt.expiration-ms)
# Secret must be base64-encoded. This is base64("test-secret-test-secret-test-secret-test-secret-1234")
app.jwt.secret=dGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtMTIzNA==
app.jwt.expiration-ms=86400000

# Email (Resend) — dummy values; we will not actually send
resend.api-key=test-key
app.mail.from=test@test.com
app.base-url=http://localhost:5173

# Avoid binding real port for integration test app context
server.port=0

# CORS
app.cors.allowed-origins=http://localhost:5173
